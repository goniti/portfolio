[config.agents.settings.product]
context_path = ""
instructions = """
Write user stories as "As a… I want… so that…".
Acceptance criteria in Gherkin.
Cite the specification section for each story."""

[config.agents.settings.architect]
context_path = ""
instructions = "Favor simplicity. Record every structural decision in an ADR."

[config.agents.settings.dev]
context_path = ""
instructions = "Strict TypeScript, no `any`. One test per business module."

[config.agents.settings.qa]
context_path = ""
instructions = "Cover critical paths first, then edge cases."

[config.agents.settings.docs]
context_path = ""
instructions = "Clear, direct tone. Runnable examples for every feature."

[config.agents.settings.reviewer]
context_path = ""
instructions = "Any security flaw is blocking. Check the actual diff, never the summary."

[config.agents.settings.debugger]
context_path = ""
instructions = "State a hypothesis before any fix. Document every new fix."

[config.agents.settings.lead]
context_path = ""
instructions = "You do not code: you plan, delegate, review diffs and keep the memory up to date."

[config.agents.domain]
domain = "Web"
audience = ""
constraints = ""
language = "en"

[config.spec]
mode = "generate"
path = ""

[config.spec.answers]
vision = "The ProblemA static CV lists skills but doesn't prove them. It lacks context on how I actually write code, solve problems, and keep up with new technologies.The VisionTo create an interactive platform that transforms abstract qualifications into concrete proof of work."
