# Root package: the Next.js site. `studio/`: the Sanity Studio (ADR-003). `packages/content-model`:
# the content model both of them import (ADR-004).
packages:
  - studio
  - 'packages/*'

# Patched versions of vulnerable transitive dependencies of the Sanity CLI (`@sanity/cli` >
# `@vercel/frameworks`): dev-time tooling of the Studio, never shipped with the site.
overrides:
  'js-yaml@>=3.0.0 <3.15.2': ^3.15.2
  'smol-toml@<1.7.1': ^1.9.1
  # Same for the tooling of Lighthouse CI (`@lhci/cli`), `serve` and the Sanity CLI (`typeid-js`),
  # flagged by `pnpm audit:deps` with no upstream release on the patched versions yet. Dev-time only.
  'basic-ftp@<6.2.1': ^6.2.1
  'compression@<1.8.2': ^1.8.2
  'tmp@<0.2.6': ^0.2.6
  'uuid@<11.1.1': ^11.1.1

auditConfig:
  ignoreGhsas:
    # braces <= 3.0.3 (stack exhaustion on deeply nested patterns): no patched release exists.
    # Only reached through the Sanity CLI's file watcher (`@sanity/codegen` > chokidar), which
    # expands the repository's own glob patterns at dev time; nothing ships with the site.
    - GHSA-vfj7-8cjw-p6xm
