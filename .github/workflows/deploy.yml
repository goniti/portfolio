name: Deploy to GitHub Pages

# Static export (`out/`) served at https://goniti.github.io/portfolio/ (ADR-003).
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Kept for an optional Sanity publish webhook; none is configured, content is deployed by hand (ADR-003, amendment 2026-10-15).
  repository_dispatch:
    types: [sanity-content-published]

# One deployment at a time: a newer push or publish replaces the one in progress.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

# Sanity content (ADR-003): repository variables, not secrets (the dataset is public).
env:
  SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
  SANITY_DATASET: ${{ vars.SANITY_DATASET }}
  SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
  # Optional Calendly page, inlined into the static export; unset hides the "Book a call" tab.
  NEXT_PUBLIC_CALENDLY_URL: ${{ vars.NEXT_PUBLIC_CALENDLY_URL }}
  # Storybook folder inside the export: served at <site>/storybook/ (`/portfolio/storybook/` on
  # the project page, `/storybook/` once the custom domain is live).
  STORYBOOK_DIR: storybook

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Fails fast with a readable report (document › field › locale); the previous deploy
      # stays online.
      - name: Content check
        run: pnpm content:check
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio
          NEXT_PUBLIC_SITE_URL: https://goniti.github.io/portfolio
      # Storybook builds with relative URLs: it works under any base path.
      - name: Build Storybook
        run: pnpm build-storybook --output-dir "out/$STORYBOOK_DIR"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          # Ships `.nojekyll`.
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
