name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Sanity content (ADR-003): repository variables, not secrets (the dataset is public).
env:
  SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
  SANITY_DATASET: ${{ vars.SANITY_DATASET }}
  SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION }}
  # Optional Calendly page, inlined into the static export; unset hides the "Book a call" tab.
  NEXT_PUBLIC_CALENDLY_URL: ${{ vars.NEXT_PUBLIC_CALENDLY_URL }}

jobs:
  quality:
    name: Quality & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Content check (every field, every locale)
        run: pnpm content:check
      - name: TypeGen drift
        run: |
          pnpm typegen
          git diff --exit-code -- src/shared/api/sanity/sanity.types.ts || {
            echo '::error::sanity.types.ts is stale: run `pnpm typegen` and commit the result.'
            exit 1
          }
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Architecture
        run: pnpm lint:arch
      - name: Typecheck
        run: pnpm typecheck
      - name: Dead code (knip)
        run: pnpm knip
      - name: Secret scan
        run: pnpm secrets
      - name: Inclusive language
        run: pnpm lint:language
      - name: Tests
        run: pnpm coverage
      - name: Build
        run: pnpm build
      - name: Client bundle (no zod)
        run: pnpm bundle:check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level high

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      # Renders every story in Chromium; an accessibility violation fails the story.
      - name: Story tests
        run: pnpm test:storybook
      - name: Build
        run: pnpm build-storybook

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (mobile, warn only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Builds the export under /portfolio and audits it with the runner's Chrome. Every assertion
      # of lighthouserc.json is a warning: a score under target never fails the job.
      - name: Lighthouse CI
        run: pnpm lighthouse
      - name: Scores
        if: always() && hashFiles('lighthouse-report/manifest.json') != ''
        run: |
          {
            echo '### Lighthouse (mobile), target ≥ 95'
            echo
            echo '| Run | Performance | Accessibility | Best practices | SEO |'
            echo '| --- | --- | --- | --- | --- |'
            jq -r 'to_entries[] | .value.summary as $score
              | "| \(.key + 1)\(if .value.isRepresentativeRun then " (representative)" else "" end) | \($score.performance * 100 | round) | \($score.accessibility * 100 | round) | \($score["best-practices"] * 100 | round) | \($score.seo * 100 | round) |"' \
              lighthouse-report/manifest.json
            echo
            echo 'Full reports: the `lighthouse-report` artifact of this run.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
